schema: spec-driven

# Project context (optional)
# Add only constraints that should guide OpenSpec artifacts and workflows.
# Include constraints an agent cannot infer by reading the code.
# Keep general project documentation and discoverable codebase facts out.
# Example:
#   context: |
#     Designs and tasks must cover Windows, macOS, and Linux
#     Write all artifacts in Spanish
context: |
  This repo is a Go workspace (go.work at the root) of separate Go modules,
  one per top-level easylist-* folder. One openspec/ at the root covers all of them.
  - easylist-filter: parses filter expressions into an AST. It must stay free of
    third-party dependencies and must not know about schemas or SQL.
  - easylist-core (package easylist): list definitions, the registry, the
    planner, runtime execution, and the shared contracts (Plan, Driver,
    Exporter, ExportRequest). Depends only on the standard library and
    easylist-filter.
  - easylist-sql-goqu (package sqlgoqu): PostgreSQL driver that compiles plans
    into prepared SQL via goqu. Depends on easylist-core.
  - easylist-gqlgen (package easylistgql): gqlgen plugin and runtime
    resolvers. Depends on easylist-core, gqlgen, and gqlparser.
  - easylist-export (package easylistexport): CSV and XLSX export worker.
    Depends on easylist-core and excelize.
  Dependencies point toward easylist-filter: filter <- core <- {sql-goqu,
  gqlgen, export}. No module imports a sibling that depends on it.
  The modules are unpublished, so they build only inside the workspace, and
  go.mod files do not require sibling modules.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours
rules:
  proposal:
    - List every module (easylist-* folder) the change touches
  specs:
    - Name capabilities <module>-<behaviour> without the easylist- prefix, e.g. filter-parsing or sql-goqu-compilation
    - Put behaviour shared between modules (such as the AST contract) in a contract-<name> capability
  tasks:
    - Group tasks under one heading per module, in dependency order (easylist-filter, then easylist-core, then the modules that depend on it)
    - When grammar.y changes, include a task to run go generate and commit parser_gen.go

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
operations:
  apply:
    guidance:
      - Implement each numbered task group (## heading in tasks.md) by delegating it to one general-purpose subagent, one group at a time in order. Give it the change name, the group's tasks, and the paths from contextFiles; tell it not to edit tasks.md.
      - After each subagent returns, review its summary, run the module's tests yourself, then tick that group's checkboxes and rerun the apply instructions before starting the next group.
